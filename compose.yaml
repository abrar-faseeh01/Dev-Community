name: devcommunity

services:
  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1026:1025" # host 1026 -> container 1025 (SMTP)
      - "127.0.0.1:8025:8025" # web inbox

  backend:
    build:
      context: ./backend
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Mailpit only receives mail; a send that fails before it is up is
      # retried by the queue, so starting is enough.
      mailpit:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/devcommunity
      # Service names on the Compose network, and the container's own ports:
      # 1025 is Mailpit's SMTP port inside the network (1026 is only the host
      # mapping). NODE_ENV=production also turns the /admin/queues dashboard
      # off (BULL_BOARD_ENABLED defaults to false there).
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in the root .env}
      FRONTEND_ORIGIN: http://localhost:3001
      COOKIE_REFRESH_PATH: /auth
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
  seed:
    build:
      context: ./backend
      target: build
    profiles: ["tools"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongo:27017/devcommunity
      - ADMIN_FULLNAME
      - ADMIN_EMAIL
      - ADMIN_PASSWORD
    command: ["npm", "run", "seed:admin"]

volumes:
  mongo-data:
